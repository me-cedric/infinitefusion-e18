# =============================================================================
# Meson cross-compilation file for Emscripten (wasm32-unknown-emscripten)
# Used by mkxp-z and pixman builds
# =============================================================================

[binaries]
c = '/emsdk/upstream/emscripten/emcc'
cpp = '/emsdk/upstream/emscripten/em++'
ar = '/emsdk/upstream/emscripten/emar'
ranlib = '/emsdk/upstream/emscripten/emranlib'
strip = '/emsdk/upstream/emscripten/emstrip'
pkgconfig = 'pkg-config'
exe_wrapper = 'node'

[built-in options]
c_args = ['-O2', '-I/build/wasm-sysroot/include', '-sUSE_SDL=2', '-sUSE_SDL_IMAGE=2', '-sUSE_SDL_TTF=2', '-sUSE_FREETYPE=1', '-sUSE_ZLIB=1', '-sUSE_LIBPNG=1', '-DGLES2_HEADER', '-DHAVE_NANOSLEEP']
cpp_args = ['-O2', '-I/build/wasm-sysroot/include', '-sUSE_SDL=2', '-sUSE_SDL_IMAGE=2', '-sUSE_SDL_TTF=2', '-sUSE_FREETYPE=1', '-sUSE_ZLIB=1', '-sUSE_LIBPNG=1', '-std=c++14', '-DGLES2_HEADER', '-DHAVE_NANOSLEEP']
c_link_args = ['-L/build/wasm-sysroot/lib', '-sUSE_SDL=2', '-sUSE_SDL_IMAGE=2', '-sUSE_SDL_TTF=2', '-sUSE_FREETYPE=1', '-sUSE_ZLIB=1', '-sUSE_LIBPNG=1', '-sALLOW_MEMORY_GROWTH=1', '-sINITIAL_MEMORY=268435456', '-sMAXIMUM_MEMORY=536870912', '-sSTACK_SIZE=1048576', '-sASYNCIFY', '-sASYNCIFY_STACK_SIZE=65536', '-sFORCE_FILESYSTEM=1', '-lidbfs.js', '-sFETCH', '-sEXPORTED_RUNTIME_METHODS=FS,IDBFS,ccall,cwrap,addRunDependency,removeRunDependency', '-sEXPORTED_FUNCTIONS=_main,_malloc,_free', '-sMODULARIZE=1', '-sEXPORT_NAME=createMkxpModule', '-sWASM=1', '-O2', '-flto']
cpp_link_args = ['-L/build/wasm-sysroot/lib', '-sUSE_SDL=2', '-sUSE_SDL_IMAGE=2', '-sUSE_SDL_TTF=2', '-sUSE_FREETYPE=1', '-sUSE_ZLIB=1', '-sUSE_LIBPNG=1', '-sALLOW_MEMORY_GROWTH=1', '-sINITIAL_MEMORY=268435456', '-sMAXIMUM_MEMORY=536870912', '-sSTACK_SIZE=1048576', '-sASYNCIFY', '-sASYNCIFY_STACK_SIZE=65536', '-sFORCE_FILESYSTEM=1', '-lidbfs.js', '-sFETCH', '-sEXPORTED_RUNTIME_METHODS=FS,IDBFS,ccall,cwrap,addRunDependency,removeRunDependency', '-sEXPORTED_FUNCTIONS=_main,_malloc,_free', '-sMODULARIZE=1', '-sEXPORT_NAME=createMkxpModule', '-sWASM=1', '-O2', '-flto']

[properties]
sys_root = '/emsdk/upstream/emscripten/cache/sysroot'
pkg_config_libdir = '/build/wasm-sysroot/lib/pkgconfig:/emsdk/upstream/emscripten/cache/sysroot/lib/pkgconfig'
needs_exe_wrapper = true

[host_machine]
system = 'emscripten'
cpu_family = 'wasm32'
cpu = 'wasm32'
endian = 'little'

